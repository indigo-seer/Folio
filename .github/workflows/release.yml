name: Build and Release Folium
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install

      - name: Fix node_modules binary permissions (macOS & Linux)
        if: matrix.platform != 'windows-latest'
        run: chmod -R +x node_modules/.bin/ || true

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Folium ${{ github.ref_name }}"
          releaseBody: "Official release of Folium ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - name: Create Linux portable tar.gz
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "=== Checking for deb package ==="
          
          # Find deb file in multiple possible locations
          DEB_FILE=""
          for dir in src-tauri/target/release/bundle/deb src-tauri/target/release/bundle; do
            echo "Checking: $dir"
            if [ -d "$dir" ]; then
              FOUND=$(find "$dir" -name "*.deb" 2>/dev/null | head -1)
              if [ -n "$FOUND" ]; then
                DEB_FILE="$FOUND"
                break
              fi
            fi
          done
          
          echo "Found deb: $DEB_FILE"
          
          if [ -z "$DEB_FILE" ]; then
            echo "No deb file found, looking for app binary directly..."
            # Fallback: look for the built binary
            if [ -f "src-tauri/target/release/folium" ]; then
              PORTABLE_DIR="folium-linux-x64"
              mkdir -p "$PORTABLE_DIR"
              cp "src-tauri/target/release/folium" "$PORTABLE_DIR/"
              
              # Copy resources if they exist
              if [ -d "src-tauri/target/release/resources" ]; then
                cp -r "src-tauri/target/release/resources" "$PORTABLE_DIR/"
              fi
              
              # Also check in bundle directory
              if [ -d "src-tauri/target/release/bundle" ]; then
                for res_dir in src-tauri/target/release/bundle/*/resources; do
                  if [ -d "$res_dir" ]; then
                    mkdir -p "$PORTABLE_DIR/resources"
                    cp -r "$res_dir"/* "$PORTABLE_DIR/resources/" 2>/dev/null || true
                  fi
                done
                # Also copy bin if it exists
                for bin_dir in src-tauri/target/release/bundle/*/resources/bin; do
                  if [ -d "$bin_dir" ]; then
                    mkdir -p "$PORTABLE_DIR/resources/bin"
                    cp -r "$bin_dir"/* "$PORTABLE_DIR/resources/bin/" 2>/dev/null || true
                  fi
                done
              fi
              
              if [ -d "$PORTABLE_DIR/resources" ]; then
                tar -czvf "folium-linux-x64.tar.gz" "$PORTABLE_DIR"
                echo "Created tar.gz with resources"
              else
                echo "No resources found, skipping tar.gz"
                rm -rf "$PORTABLE_DIR"
              fi
            else
              echo "No binary found at src-tauri/target/release/folium"
            fi
          else
            # Extract deb contents
            echo "Extracting deb: $DEB_FILE"
            TEMP_DIR=$(mktemp -d)
            dpkg-deb -x "$DEB_FILE" "$TEMP_DIR"
            
            # Find the app directory
            APP_DIR=""
            for dir in "$TEMP_DIR/usr/lib/folium" "$TEMP_DIR/usr/bin"; do
              if [ -d "$dir" ]; then
                APP_DIR="$dir"
                break
              fi
            done
            
            echo "App directory: $APP_DIR"
            
            if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
              PORTABLE_DIR="folium-linux-x64"
              mkdir -p "$PORTABLE_DIR"
              
              # Copy binary (might be named 'folium')
              for bin in "$APP_DIR/folium" "$APP_DIR/folium-bin"; do
                if [ -f "$bin" ]; then
                  cp "$bin" "$PORTABLE_DIR/folium"
                  break
                fi
              done
              
              # Copy resources
              if [ -d "$APP_DIR/resources" ]; then
                cp -r "$APP_DIR/resources" "$PORTABLE_DIR/"
              fi
              
              # Also check for resources in usr/share
              if [ -d "$TEMP_DIR/usr/share/folium/resources" ]; then
                mkdir -p "$PORTABLE_DIR/resources"
                cp -r "$TEMP_DIR/usr/share/folium/resources"/* "$PORTABLE_DIR/resources/" 2>/dev/null || true
              fi
              
              # Also copy lib/folium/resources if exists
              if [ -d "$TEMP_DIR/usr/lib/folium/resources" ]; then
                mkdir -p "$PORTABLE_DIR/resources"
                cp -r "$TEMP_DIR/usr/lib/folium/resources"/* "$PORTABLE_DIR/resources/" 2>/dev/null || true
              fi
              
              # Find syncthing binary in lib folder
              if [ -d "$TEMP_DIR/usr/lib/folium" ]; then
                SYNCBIN=$(find "$TEMP_DIR/usr/lib/folium" -name "syncthing-*" -type f 2>/dev/null | head -1)
                if [ -n "$SYNCBIN" ]; then
                  echo "Found syncthing: $SYNCBIN"
                  mkdir -p "$PORTABLE_DIR/resources/bin"
                  cp "$SYNCBIN" "$PORTABLE_DIR/resources/bin/"
                fi
              fi
              
              if [ -d "$PORTABLE_DIR/resources" ] || [ -f "$PORTABLE_DIR/folium" ]; then
                tar -czvf "folium-linux-x64.tar.gz" "$PORTABLE_DIR"
                echo "Created tar.gz successfully"
              else
                echo "No contents to package"
              fi
              
              rm -rf "$TEMP_DIR"
            else
              echo "Could not find app directory in deb"
              rm -rf "$TEMP_DIR"
            fi
          fi
          
          # Upload if created
          if [ -f "folium-linux-x64.tar.gz" ]; then
            echo "Uploading tar.gz..."
            REPO="${{ github.repository }}"
            TAG="${{ github.ref_name }}"
            gh release upload "$TAG" "folium-linux-x64.tar.gz" --repo "$REPO" || echo "Upload failed (may need to check release exists)"
          else
            echo "tar.gz was not created"
          fi