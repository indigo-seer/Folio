name: Build and Release Folium
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install

      - name: Fix node_modules binary permissions (macOS & Linux)
        if: matrix.platform != 'windows-latest'
        run: chmod -R +x node_modules/.bin/ || true

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Folium ${{ github.ref_name }}"
          releaseBody: "Official release of Folium ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - name: Create Linux portable tar.gz
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Find the built deb package
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          if [ -n "$DEB_FILE" ]; then
            # Extract deb contents
            TEMP_DIR=$(mktemp -d)
            dpkg-deb -x "$DEB_FILE" "$TEMP_DIR"
            
            # Find the app binary and resources
            APP_DIR="$TEMP_DIR/usr/lib/folium"
            if [ -d "$APP_DIR" ]; then
              # Create portable tar.gz structure
              PORTABLE_DIR="folium-linux-x64"
              mkdir -p "$PORTABLE_DIR"
              
              # Copy binary
              if [ -f "$APP_DIR/folium" ]; then
                cp "$APP_DIR/folium" "$PORTABLE_DIR/"
              fi
              
              # Copy resources (contains syncthing binary)
              if [ -d "$APP_DIR/resources" ]; then
                cp -r "$APP_DIR/resources" "$PORTABLE_DIR/"
              fi
              
              # Create tar.gz
              tar -czvf "folium-linux-x64.tar.gz" "$PORTABLE_DIR"
              
              # Upload as release asset
              echo "Uploading Linux portable tar.gz..."
              
              # Get release ID
              REPO="${{ github.repository }}"
              TAG="${{ github.ref_name }}"
              
              # Upload using gh CLI
              gh release upload "$TAG" "folium-linux-x64.tar.gz" --repo "$REPO" || true
              
              # Cleanup
              rm -rf "$TEMP_DIR" "$PORTABLE_DIR"
            fi
          fi