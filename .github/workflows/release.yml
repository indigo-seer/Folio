name: Build and Release Folium
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
  checks: write
jobs:
  audit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust dependency audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  build:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix node_modules binary permissions (macOS & Linux)
        if: matrix.platform != 'windows-latest'
        run: chmod -R +x node_modules/.bin/ || true

      - name: Verify Aptabase secret is configured
        shell: bash
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
        run: |
          if [[ -z "${APTABASE_KEY:-}" ]]; then
            echo "APTABASE_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Verify source before packaging
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
        run: |
          pnpm test
          pnpm run build
          pnpm audit --prod
          cd src-tauri
          cargo fmt --check
          cargo check --locked
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Folium ${{ github.ref_name }}"
          releaseBody: "Official release of Folium ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
